# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
name: Build and deploy Node.js app to Azure Web App - stoqr

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install, build, and test
        run: |
          npm ci
          npm run build --if-present
          npm run test --if-present

      - name: Assemble runtime bundle
        run: |
          rm -rf release
          mkdir -p release
          cp -R .next release/
          cp -R node_modules release/
          cp -R public release/
          cp package.json release/
          cp server.js release/
          cp next.config.mjs release/
          cp .env* release/ 2>/dev/null || true
          # Remove Oryx files to prevent Azure from overriding startup
          rm -f release/oryx-manifest.toml
          rm -f release/node_modules.tar.gz

      - name: Create web.config
        run: |
          cat > release/web.config << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <system.webServer>
              <webSocket enabled="false" />
              <handlers>
                <add name="iisnode" path="server.js" verb="*" modules="iisnode"/>
              </handlers>
              <rewrite>
                <rules>
                  <rule name="DynamicContent">
                    <conditions>
                      <add input="{REQUEST_FILENAME}" matchType="IsFile" negate="True"/>
                    </conditions>
                    <action type="Rewrite" url="server.js"/>
                  </rule>
                </rules>
              </rewrite>
            </system.webServer>
          </configuration>
          EOF

      - name: Verify release contents
        run: |
          echo "=== Root ==="
          ls -la release/
          echo "=== .next ==="
          ls -la release/.next/
          echo "=== public ==="
          ls -la release/public/

      - name: Zip release folder
        run: |
          cd release
          zip -r ../release.zip .
          cd ..
          echo "=== Zip contents (first 30 lines) ==="
          unzip -l release.zip | head -30

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip           # ← upload zip not folder

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: ./                    # ← download to root so release.zip is at ./release.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_78003FA5C85249A7B1CCE20E51A34B48 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6E639FF7CD0140078F538EBE47176786 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7A3B44C0B85A49AD9DD57821A270D2E4 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'stoqr-bbegbhbtgjatd8fn'
          slot-name: 'Production'
          package: ./release.zip      # ← deploy zip so .next/ is not skipped
          clean: true
